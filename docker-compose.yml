services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crowd_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-crowd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crowd}
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://crowd:${POSTGRES_PASSWORD:-crowd}@postgres:5432/${POSTGRES_DB:-crowd_monitoring}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      VIDEO_STORAGE_PATH: /data/videos
      CV_SERVICE_URL: http://cv-service:8001
      CV_ANALYSIS_TIMEOUT_SECONDS: ${CV_ANALYSIS_TIMEOUT_SECONDS:-600}
      HEATMAP_GRID_WIDTH: ${HEATMAP_GRID_WIDTH:-32}
      HEATMAP_GRID_HEIGHT: ${HEATMAP_GRID_HEIGHT:-18}
      LIVE_TARGET_FPS: ${LIVE_TARGET_FPS:-3}
      LIVE_MAX_FRAME_BYTES: ${LIVE_MAX_FRAME_BYTES:-524288}
      LIVE_RECENT_OBSERVATIONS: ${LIVE_RECENT_OBSERVATIONS:-300}
      LIVE_SESSION_STALE_SECONDS: ${LIVE_SESSION_STALE_SECONDS:-10}
      LIVE_MAX_SESSIONS: ${LIVE_MAX_SESSIONS:-8}
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      cv-service: {condition: service_started}
    volumes: [video-storage:/data/videos]
  frontend:
    build: ./frontend
    environment: [VITE_API_BASE_URL=http://localhost:8000]
    ports: ["5173:5173"]
    depends_on: [backend]
  cv-service:
    build: ./cv-service
    environment:
      YOLO_MODEL: ${YOLO_MODEL:-yolo11n.pt}
      YOLO_CONFIDENCE_THRESHOLD: ${YOLO_CONFIDENCE_THRESHOLD:-0.35}
      YOLO_IMAGE_SIZE: ${YOLO_IMAGE_SIZE:-640}
      YOLO_FRAME_STRIDE: ${YOLO_FRAME_STRIDE:-5}
      TRACKER_TYPE: ${TRACKER_TYPE:-bytetrack}
      TRACK_FRAME_STRIDE: ${TRACK_FRAME_STRIDE:-1}
      TRACK_HIGH_THRESHOLD: ${TRACK_HIGH_THRESHOLD:-0.25}
      TRACK_LOW_THRESHOLD: ${TRACK_LOW_THRESHOLD:-0.1}
      TRACK_MATCH_THRESHOLD: ${TRACK_MATCH_THRESHOLD:-0.8}
      TRACK_BUFFER: ${TRACK_BUFFER:-30}
      CROWD_MODERATE_COUNT: ${CROWD_MODERATE_COUNT:-5}
      CROWD_HIGH_COUNT: ${CROWD_HIGH_COUNT:-10}
      CROWD_VERY_HIGH_COUNT: ${CROWD_VERY_HIGH_COUNT:-20}
      LIVE_MAX_FRAME_BYTES: ${LIVE_MAX_FRAME_BYTES:-524288}
      LIVE_MAX_FRAME_PIXELS: ${LIVE_MAX_FRAME_PIXELS:-921600}
      LIVE_WORKER_IDLE_SECONDS: ${LIVE_WORKER_IDLE_SECONDS:-120}
      LIVE_MAX_SESSIONS: ${LIVE_MAX_SESSIONS:-8}
    ports: ["127.0.0.1:8001:8001"]
volumes:
  postgres-data:
  video-storage:
